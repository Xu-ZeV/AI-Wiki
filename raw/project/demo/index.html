<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js 3D 教学与数字孪生展示工程</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    .scene-switcher {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(22, 27, 34, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 6px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }

    .scene-switcher a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: #8b949e;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }

    .scene-switcher a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .scene-switcher a.active {
      background: #238636;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(35, 134, 54, 0.4);
    }
  </style>
</head>

<body>
  <!-- 顶部场景多路无缝切换器 -->
  <nav class="scene-switcher" aria-label="场景切换">
    <a id="btn-terminal" href="?scene=terminal">🚦 武汉交投自助终端</a>
    <a id="btn-main" href="?scene=main">🍩 基础教学控制台</a>
  </nav>

  <!-- WebGL Canvas 渲染视口 -->
  <canvas class="webgl"></canvas>

  <!-- WebGL 环境异常/不可用优雅降级提示卡片 -->
  <div id="webgl-fallback" class="webgl-fallback">
    <div class="fallback-card">
      <div class="fallback-icon">⚠️</div>
      <h2 class="fallback-title">无法启用 WebGL 渲染环境</h2>
      <p class="fallback-desc">
        您的浏览器或显卡驱动暂不支持硬件加速的 WebGL / WebGL 2 上下文，或者该功能已被禁用。
      </p>
      <div class="fallback-tips">
        <p>建议排查方案：</p>
        <ul>
          <li>在浏览器设置中启用“硬件加速”选项</li>
          <li>检查显卡驱动程序是否正常更新</li>
          <li>尝试使用最新版 Chrome、Firefox 或 Edge 浏览器访问</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 动态场景装载器 -->
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const sceneParam = params.get('scene');

    const btnTerminal = document.getElementById('btn-terminal');
    const btnMain = document.getElementById('btn-main');

    if (sceneParam === 'main') {
      btnMain.classList.add('active');
      import('./src/main.ts');
    } else {
      // 默认载入全新的武汉交投终端
      btnTerminal.classList.add('active');
      import('./src/terminal.ts');
    }
  </script>
</body>

</html>
